<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grifador</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css?v=5">
</head>
<body>
  <div class="bar" id="bar">
    <button class="switch" id="autoSwitch" role="switch" aria-checked="true"
            aria-label="Modo marca-texto" title="Modo marca-texto"><span class="knob"></span></button>
    <button class="sw" data-color="#FFFF00" aria-label="Amarelo" title="Amarelo"><span class="dot" style="background:#FFFF00"></span></button>
    <button class="sw" data-color="#00FFFF" aria-label="Azul claro" title="Azul claro"><span class="dot" style="background:#00FFFF"></span></button>
    <button class="sw" data-color="#00FF00" aria-label="Verde claro" title="Verde claro"><span class="dot" style="background:#00FF00"></span></button>
    <button class="sw" data-color="#FF0000" aria-label="Vermelho" title="Vermelho"><span class="dot" style="background:#FF0000"></span></button>
    <button class="sw" data-color="none" aria-label="Borracha" title="Borracha"><span class="dot eraser">
      <svg viewBox="0 0 16 16" width="8" height="8" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </span></button>
    <button class="icon" id="undoBtn" aria-label="Desfazer último grifo" title="Desfazer último grifo">
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M5 3L2 6l3 3M2 6h7a4 4 0 010 8H6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <script src="taskpane.js?v=5"></script>
</body>
</html>
